                  - tplTxtNome:
                      Control: Classic/TextInput
                      Properties:
                        AccessibleLabel: ="Informe o nome"
                        BorderColor: =corBorda
                        BorderThickness: =1
                        Color: =corTexto
                        Default: =""
                        DisabledBorderColor: =corBorda
                        DisabledColor: =corTextoSec
                        DisabledFill: =corFundo
                        Fill: =Color.White
                        FocusedBorderColor: =corPrimaria
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        Height: =36
                        HintText: ="Informe o nome"
                        HoverBorderColor: =corPrimaria
                        HoverFill: =Color.White
                        LayoutMinWidth: =0
                        PaddingLeft: =10
                        RadiusBottomLeft: =6
                        RadiusBottomRight: =6
                        RadiusTopLeft: =6
                        RadiusTopRight: =6
                        Size: =10
                        TabIndex: =0
