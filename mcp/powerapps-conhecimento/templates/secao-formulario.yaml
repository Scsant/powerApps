# Card de seção numerada com 2 linhas de 3 campos (texto, combo de Choice, data). Filho de container vertical com LayoutAlignItems Stretch.
# Cole dentro de Children:. Troque o prefixo 'tpl' (obter_template com prefixo) — nomes são globais no app.
# Requer os tokens de cor (obter_template('tokens-app-formulas')).
- tplSec:
    Control: GroupContainer
    Variant: AutoLayout
    Properties:
      AlignInContainer: =AlignInContainer.SetByContainer
      BorderColor: =corBorda
      BorderThickness: =1
      DropShadow: =DropShadow.None
      Fill: =corCard
      FillPortions: =0
      Height: =212
      LayoutAlignItems: =LayoutAlignItems.Stretch
      LayoutDirection: =LayoutDirection.Vertical
      LayoutGap: =12
      LayoutMinHeight: =0
      LayoutMinWidth: =0
      PaddingBottom: =20
      PaddingLeft: =20
      PaddingRight: =20
      PaddingTop: =20
      RadiusBottomLeft: =10
      RadiusBottomRight: =10
      RadiusTopLeft: =10
      RadiusTopRight: =10
    Children:
      - tplSecTitulo:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            AlignInContainer: =AlignInContainer.SetByContainer
            BorderThickness: =0
            DropShadow: =DropShadow.None
            FillPortions: =0
            Height: =24
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutGap: =4
            LayoutMinHeight: =0
            LayoutMinWidth: =0
          Children:
            - tplSecNum:
                Control: Label
                Properties:
                  AutoHeight: =false
                  Color: =corPrimaria
                  FocusedBorderThickness: =0
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =24
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =10
                  TabIndex: =-1
                  Text: ="01"
                  VerticalAlign: =VerticalAlign.Middle
                  Width: =26
                  Wrap: =true
            - tplSecNome:
                Control: Label
                Properties:
                  AutoHeight: =false
                  Color: =corTexto
                  FillPortions: =1
                  FocusedBorderThickness: =0
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =24
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =13
                  TabIndex: =-1
                  Text: ="Dados da retirada"
                  VerticalAlign: =VerticalAlign.Middle
                  Wrap: =true
      - tplSecL1:
