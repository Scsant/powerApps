                        Text: ="Área"
                        Wrap: =true
                  - tplCbArea:
                      Control: Classic/ComboBox
                      Properties:
                        AccessibleLabel: ="Selecione a área"
                        BorderColor: =corBorda
                        BorderThickness: =1
                        ChevronBackground: =Color.White
                        ChevronFill: =corTextoSec
                        ChevronHoverBackground: =corFundo
                        ChevronHoverFill: =corPrimaria
                        Color: =corTexto
                        DisplayFields: =["Value"]
                        Fill: =Color.White
                        Font: =Font.'Segoe UI'
                        Height: =36
                        HoverBorderColor: =corPrimaria
                        HoverFill: =Color.White
                        InputTextPlaceholder: ="Selecione a área"
                        IsSearchable: =false
                        Items: =opcArea
                        LayoutMinWidth: =0
                        PressedColor: =corTexto
                        PressedFill: =Color.White
                        SearchFields: =["Value"]
                        SelectMultiple: =false
                        SelectionColor: =corTexto
                        SelectionFill: =corPrimariaClara
                        Size: =10
                        TabIndex: =0
            - tplDataCampo:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
