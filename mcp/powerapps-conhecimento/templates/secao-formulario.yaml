                  - tplDtData:
                      Control: Classic/DatePicker
                      Properties:
                        AccessibleLabel: ="Data"
                        BorderColor: =corBorda
                        BorderThickness: =1
                        Color: =corTexto
                        DefaultDate: =Blank()
                        EndYear: =Year(Today()) + 1
                        Fill: =Color.White
                        Font: =Font.'Segoe UI'
                        Format: ="dd/mm/yyyy"
                        Height: =36
                        IconBackground: =Color.White
                        IconFill: =corTextoSec
                        InputTextPlaceholder: ="dd/mm/aaaa"
                        LayoutMinWidth: =0
                        Size: =10
                        StartYear: =Year(Today())
                        TabIndex: =0
