                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  BorderThickness: =0
                  DropShadow: =DropShadow.None
                  FillPortions: =1
                  Height: =62
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =6
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                Children:
                  - tplNomeRotulo:
                      Control: Label
                      Properties:
                        AutoHeight: =true
                        Color: =corTexto
                        FocusedBorderThickness: =0
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =10
                        TabIndex: =-1
