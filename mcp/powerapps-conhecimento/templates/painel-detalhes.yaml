# Overlay + painel lateral direito de detalhes (usa varDados/varModal). Cole na TELA, depois do container raiz (não dentro de AutoLayout).
# Cole dentro de Children:. Troque o prefixo 'tpl' (obter_template com prefixo) — nomes são globais no app.
# Requer os tokens de cor (obter_template('tokens-app-formulas')).
- tplOverlay:
    Control: Rectangle
    Properties:
      AccessibleLabel: ="Fechar"
      Fill: =RGBA(15, 23, 42, 0.45)
      FocusedBorderColor: =corTexto
      FocusedBorderThickness: =2
      Height: =Parent.Height
      OnSelect: |-
        =UpdateContext({varModal: false})
      TabIndex: =0
      Visible: =varModal
      Width: =Parent.Width
      X: =0
      Y: =0
- tplPainel:
    Control: GroupContainer
    Variant: AutoLayout
    Properties:
      BorderThickness: =0
      DropShadow: =DropShadow.ExtraBold
      Fill: =Color.White
      Height: =Parent.Height
      LayoutAlignItems: =LayoutAlignItems.Stretch
      LayoutDirection: =LayoutDirection.Vertical
      LayoutGap: =12
      LayoutOverflowY: =LayoutOverflow.Scroll
      PaddingBottom: =24
      PaddingLeft: =24
      PaddingRight: =24
      PaddingTop: =24
      Visible: =varModal
      Width: =Min(460, Parent.Width)
      X: =Parent.Width - Self.Width
      Y: =0
    Children:
      - tplDetTopo:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            AlignInContainer: =AlignInContainer.SetByContainer
            BorderThickness: =0
            DropShadow: =DropShadow.None
            FillPortions: =0
            Height: =44
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutGap: =8
            LayoutMinHeight: =0
            LayoutMinWidth: =0
          Children:
            - tplDetTopoTxt:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  BorderThickness: =0
                  DropShadow: =DropShadow.None
                  FillPortions: =1
                  Height: =44
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =2
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                Children:
                  - tplDetKicker:
                      Control: Label
                      Properties:
                        AutoHeight: =true
                        Color: =corTextoSec
                        FocusedBorderThickness: =0
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =8
                        TabIndex: =-1
                        Text: ="SOLICITAÇÃO"
                        Wrap: =true
                  - tplDetTitulo:
                      Control: Label
                      Properties:
                        AutoHeight: =true
                        Color: =corTexto
                        FocusedBorderThickness: =0
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =16
                        TabIndex: =-1
                        Text: ="Reserva SAP " & varDados.reservaSap
                        Wrap: =true
            - tplDetFechar:
                Control: Classic/Button
                Properties:
                  BorderColor: =corBorda
                  BorderThickness: =1
                  Color: =corPrimaria
                  Fill: =Color.White
                  FocusedBorderColor: =corTexto
                  FocusedBorderThickness: =2
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =36
                  HoverBorderColor: =corPrimaria
                  HoverColor: =corPrimaria
                  HoverFill: =corFundo
                  OnSelect: |-
                    =UpdateContext({varModal: false})
                  PressedBorderColor: =corBorda
                  PressedColor: =corPrimaria
                  PressedFill: =corBorda
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  Size: =10
                  Text: ="✕"
                  Tooltip: ="Fechar detalhes"
                  Width: =36
