# Overlay + modal central de confirmação destrutiva (locConfirmar). Cole na TELA, depois do container raiz.
# Cole dentro de Children:. Troque o prefixo 'tpl' (obter_template com prefixo) — nomes são globais no app.
# Requer os tokens de cor (obter_template('tokens-app-formulas')).
- tplConfOverlay:
    Control: Rectangle
    Properties:
      AccessibleLabel: ="Fechar"
      Fill: =RGBA(15, 23, 42, 0.45)
      FocusedBorderColor: =corTexto
      FocusedBorderThickness: =2
      Height: =Parent.Height
      OnSelect: |-
        =UpdateContext({locConfirmar: false})
      TabIndex: =0
      Visible: =locConfirmar
      Width: =Parent.Width
      X: =0
      Y: =0
- tplConf:
    Control: GroupContainer
    Variant: AutoLayout
    Properties:
      BorderColor: =corBorda
      BorderThickness: =1
      DropShadow: =DropShadow.ExtraBold
      Fill: =corCard
      Height: =170
      LayoutAlignItems: =LayoutAlignItems.Stretch
      LayoutDirection: =LayoutDirection.Vertical
      LayoutGap: =14
      PaddingBottom: =20
      PaddingLeft: =20
      PaddingRight: =20
      PaddingTop: =20
      RadiusBottomLeft: =10
      RadiusBottomRight: =10
      RadiusTopLeft: =10
      RadiusTopRight: =10
      Visible: =locConfirmar
      Width: =420
      X: =(Parent.Width - Self.Width) / 2
      Y: =(Parent.Height - Self.Height) / 2
    Children:
      - tplConfTitulo:
          Control: Label
          Properties:
            AutoHeight: =true
            Color: =corTexto
            FocusedBorderThickness: =0
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Semibold
            LayoutMinHeight: =0
            LayoutMinWidth: =0
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =14
            TabIndex: =-1
            Text: ="Remover item?"
            Wrap: =true
      - tplConfTxt:
          Control: Label
          Properties:
            AutoHeight: =true
            Color: =corTextoSec
            FocusedBorderThickness: =0
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Normal
            LayoutMinHeight: =0
            LayoutMinWidth: =0
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =10
            TabIndex: =-1
            Text: ="Esta ação não pode ser desfeita."
            Wrap: =true
      - tplConfBotoes:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            AlignInContainer: =AlignInContainer.SetByContainer
            BorderThickness: =0
            DropShadow: =DropShadow.None
            FillPortions: =0
            Height: =38
            LayoutAlignItems: =LayoutAlignItems.Start
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutGap: =10
            LayoutMinHeight: =0
            LayoutMinWidth: =0
          Children:
            - tplConfEsp:
                Control: Label
                Properties:
                  AutoHeight: =false
                  FillPortions: =1
                  FocusedBorderThickness: =0
                  Height: =1
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  TabIndex: =-1
                  Text: =""
                  Width: =1
            - tplConfCancelar:
                Control: Classic/Button
                Properties:
                  BorderColor: =corBorda
                  BorderThickness: =1
                  Color: =corPrimaria
                  Fill: =Color.White
                  FocusedBorderColor: =corTexto
                  FocusedBorderThickness: =2
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =38
                  HoverBorderColor: =corPrimaria
                  HoverColor: =corPrimaria
                  HoverFill: =corFundo
                  OnSelect: |-
                    =UpdateContext({locConfirmar: false})
                  PressedBorderColor: =corBorda
                  PressedColor: =corPrimaria
                  PressedFill: =corBorda
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  Size: =10
                  Text: ="Cancelar"
                  Width: =110
            - tplConfOk:
                Control: Classic/Button
                Properties:
                  BorderColor: =corErro
                  BorderThickness: =1
                  Color: =Color.White
                  Fill: =corErro
                  FocusedBorderColor: =corTexto
                  FocusedBorderThickness: =2
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =38
                  HoverBorderColor: =corErro
                  HoverColor: =Color.White
                  HoverFill: =ColorFade(corErro, -15%)
                  OnSelect: |-
                    =UpdateContext({locConfirmar: false})
                  PressedBorderColor: =corErro
                  PressedColor: =Color.White
                  PressedFill: =ColorFade(corErro, -25%)
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  Size: =10
                  Text: ="Remover"
                  Width: =110
