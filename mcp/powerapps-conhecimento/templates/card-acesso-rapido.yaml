# Linha com 2 cards de acesso rápido (ícone, título, descrição, botão). Filho de container vertical.
# Cole dentro de Children:. Troque o prefixo 'tpl' (obter_template com prefixo) — nomes são globais no app.
# Requer os tokens de cor (obter_template('tokens-app-formulas')).
- tplCards:
    Control: GroupContainer
    Variant: AutoLayout
    Properties:
      AlignInContainer: =AlignInContainer.SetByContainer
      BorderThickness: =0
      DropShadow: =DropShadow.None
      FillPortions: =0
      Height: =190
      LayoutAlignItems: =LayoutAlignItems.Stretch
      LayoutDirection: =LayoutDirection.Horizontal
      LayoutGap: =16
      LayoutMinHeight: =0
      LayoutMinWidth: =0
    Children:
      - tplCardA:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            AlignInContainer: =AlignInContainer.SetByContainer
            BorderColor: =corBorda
            BorderThickness: =1
            DropShadow: =DropShadow.None
            Fill: =corCard
            FillPortions: =1
            Height: =190
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =10
            LayoutMinHeight: =0
            LayoutMinWidth: =0
            PaddingBottom: =20
            PaddingLeft: =20
            PaddingRight: =20
            PaddingTop: =20
            RadiusBottomLeft: =10
            RadiusBottomRight: =10
            RadiusTopLeft: =10
            RadiusTopRight: =10
          Children:
            - tplCardAIcone:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.Start
                  BorderThickness: =0
                  DropShadow: =DropShadow.None
                  Fill: =corPrimariaClara
                  FillPortions: =0
                  Height: =34
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =0
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Width: =34
                Children:
                  - tplCardAIconeTxt:
                      Control: Label
                      Properties:
                        Align: =Align.Center
                        AutoHeight: =false
                        Color: =corPrimaria
                        FillPortions: =1
                        FocusedBorderThickness: =0
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =34
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =13
                        TabIndex: =-1
                        Text: ="+"
                        VerticalAlign: =VerticalAlign.Middle
                        Wrap: =true
            - tplCardATitulo:
                Control: Label
                Properties:
                  AutoHeight: =true
                  Color: =corTexto
                  FocusedBorderThickness: =0
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =14
                  TabIndex: =-1
                  Text: ="Nova solicitação"
                  Wrap: =true
            - tplCardADesc:
                Control: Label
                Properties:
                  AutoHeight: =false
                  Color: =corTextoSec
                  FillPortions: =1
                  FocusedBorderThickness: =0
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Normal
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =9
                  TabIndex: =-1
                  Text: ="Descrição curta da ação."
                  Wrap: =true
            - tplCardABtn:
                Control: Classic/Button
                Properties:
                  BorderColor: =corPrimaria
                  BorderThickness: =1
                  Color: =Color.White
                  Fill: =corPrimaria
                  FocusedBorderColor: =corTexto
                  FocusedBorderThickness: =2
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =38
                  HoverBorderColor: =corPrimariaHover
                  HoverColor: =Color.White
                  HoverFill: =corPrimariaHover
                  OnSelect: =Navigate(Menu, ScreenTransition.Fade)
                  PressedBorderColor: =corPrimaria
                  PressedColor: =Color.White
                  PressedFill: =corPrimariaHover
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  Size: =10
                  Text: ="+  Criar"
                  Width: =170
      - tplCardB:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            AlignInContainer: =AlignInContainer.SetByContainer
            BorderColor: =corBorda
            BorderThickness: =1
            DropShadow: =DropShadow.None
            Fill: =corCard
            FillPortions: =1
            Height: =190
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =10
            LayoutMinHeight: =0
            LayoutMinWidth: =0
            PaddingBottom: =20
            PaddingLeft: =20
            PaddingRight: =20
            PaddingTop: =20
            RadiusBottomLeft: =10
            RadiusBottomRight: =10
            RadiusTopLeft: =10
            RadiusTopRight: =10
          Children:
            - tplCardBIcone:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.Start
                  BorderThickness: =0
                  DropShadow: =DropShadow.None
                  Fill: =corPrimariaClara
                  FillPortions: =0
                  Height: =34
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =0
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Width: =34
                Children:
                  - tplCardBIconeTxt:
                      Control: Label
                      Properties:
                        Align: =Align.Center
                        AutoHeight: =false
                        Color: =corPrimaria
                        FillPortions: =1
                        FocusedBorderThickness: =0
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =34
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =13
                        TabIndex: =-1
                        Text: ="≡"
                        VerticalAlign: =VerticalAlign.Middle
                        Wrap: =true
            - tplCardBTitulo:
                Control: Label
                Properties:
                  AutoHeight: =true
                  Color: =corTexto
                  FocusedBorderThickness: =0
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =14
                  TabIndex: =-1
                  Text: ="Minhas solicitações"
                  Wrap: =true
            - tplCardBDesc:
                Control: Label
                Properties:
                  AutoHeight: =false
                  Color: =corTextoSec
                  FillPortions: =1
                  FocusedBorderThickness: =0
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Normal
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =9
                  TabIndex: =-1
                  Text: ="Descrição curta da ação."
                  Wrap: =true
            - tplCardBBtn:
                Control: Classic/Button
                Properties:
                  BorderColor: =corBorda
                  BorderThickness: =1
                  Color: =corPrimaria
                  Fill: =Color.White
                  FocusedBorderColor: =corTexto
                  FocusedBorderThickness: =2
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =38
                  HoverBorderColor: =corPrimaria
                  HoverColor: =corPrimaria
                  HoverFill: =corFundo
                  OnSelect: =Navigate(Menu, ScreenTransition.Fade)
                  PressedBorderColor: =corBorda
                  PressedColor: =corPrimaria
                  PressedFill: =corBorda
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  Size: =10
                  Text: ="Consultar  →"
                  Width: =170
