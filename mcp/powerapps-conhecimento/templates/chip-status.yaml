# Chip arredondado com cor por status (GroupContainer + Label). Troque ThisItem.status.Value pela sua expressão.
# Cole dentro de Children:. Troque o prefixo 'tpl' (obter_template com prefixo) — nomes são globais no app.
# Requer os tokens de cor (obter_template('tokens-app-formulas')).
- tplStatusChip:
    Control: GroupContainer
    Variant: AutoLayout
    Properties:
      AlignInContainer: =AlignInContainer.SetByContainer
      BorderThickness: =0
      DropShadow: =DropShadow.None
      Fill: =Switch(ThisItem.status.Value, "Aguardando Separação", RGBA(255, 244, 214, 1), "Em Separação", RGBA(222, 235, 255, 1), "Pronto para Retirada", RGBA(224, 245, 233, 1), "Finalizado", RGBA(233, 236, 241, 1), "Cancelado", RGBA(253, 228, 228, 1), RGBA(233, 236, 241, 1))
      FillPortions: =0
      Height: =24
      LayoutAlignItems: =LayoutAlignItems.Center
      LayoutDirection: =LayoutDirection.Horizontal
      LayoutGap: =0
      LayoutJustifyContent: =LayoutJustifyContent.Center
      LayoutMinHeight: =0
      LayoutMinWidth: =0
      PaddingBottom: =0
      PaddingLeft: =10
      PaddingRight: =10
      PaddingTop: =0
      RadiusBottomLeft: =12
      RadiusBottomRight: =12
      RadiusTopLeft: =12
      RadiusTopRight: =12
      Width: =160
    Children:
      - tplStatusChipTxt:
          Control: Label
          Properties:
            Align: =Align.Center
            AutoHeight: =false
            Color: =Switch(ThisItem.status.Value, "Aguardando Separação", RGBA(138, 90, 0, 1), "Em Separação", RGBA(21, 82, 168, 1), "Pronto para Retirada", RGBA(22, 110, 60, 1), "Finalizado", RGBA(70, 82, 102, 1), "Cancelado", RGBA(176, 32, 32, 1), RGBA(70, 82, 102, 1))
            FillPortions: =1
            FocusedBorderThickness: =0
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Semibold
            Height: =24
            LayoutMinHeight: =0
            LayoutMinWidth: =0
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =9
            TabIndex: =-1
            Text: =ThisItem.status.Value
            VerticalAlign: =VerticalAlign.Middle
            Wrap: =true
