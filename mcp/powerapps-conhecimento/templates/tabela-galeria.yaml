# Card de tabela: cabeçalho de colunas, estado vazio e galeria com linhas clicáveis (abre painel com varDados/varModal). Items = colItens.
# Cole dentro de Children:. Troque o prefixo 'tpl' (obter_template com prefixo) — nomes são globais no app.
# Requer os tokens de cor (obter_template('tokens-app-formulas')).
- tplTabela:
    Control: GroupContainer
    Variant: AutoLayout
    Properties:
      AlignInContainer: =AlignInContainer.SetByContainer
      BorderColor: =corBorda
      BorderThickness: =1
      DropShadow: =DropShadow.None
      Fill: =corCard
      FillPortions: =0
      Height: =480
      LayoutAlignItems: =LayoutAlignItems.Stretch
      LayoutDirection: =LayoutDirection.Vertical
      LayoutGap: =4
      LayoutMinHeight: =0
      LayoutMinWidth: =0
      PaddingBottom: =12
      PaddingLeft: =12
      PaddingRight: =12
      PaddingTop: =12
      RadiusBottomLeft: =10
      RadiusBottomRight: =10
      RadiusTopLeft: =10
      RadiusTopRight: =10
    Children:
      - tplTabCab:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            AlignInContainer: =AlignInContainer.SetByContainer
            BorderThickness: =0
            DropShadow: =DropShadow.None
            Fill: =corFundo
            FillPortions: =0
            Height: =40
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutGap: =12
            LayoutMinHeight: =0
            LayoutMinWidth: =0
            PaddingBottom: =0
            PaddingLeft: =16
            PaddingRight: =16
            PaddingTop: =0
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
          Children:
            - tplTabCabId:
                Control: Label
                Properties:
                  AutoHeight: =false
                  Color: =corTextoSec
                  FocusedBorderThickness: =0
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =52
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =8
                  TabIndex: =-1
                  Text: ="Nº"
                  VerticalAlign: =VerticalAlign.Middle
                  Width: =56
                  Wrap: =false
            - tplTabCabCriado:
                Control: Label
                Properties:
                  AutoHeight: =false
                  Color: =corTextoSec
                  FocusedBorderThickness: =0
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =52
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =8
                  TabIndex: =-1
                  Text: ="CRIADO EM"
                  VerticalAlign: =VerticalAlign.Middle
                  Width: =110
                  Wrap: =false
            - tplTabCabSolic:
                Control: Label
                Properties:
                  AutoHeight: =false
                  Color: =corTextoSec
                  FillPortions: =1
                  FocusedBorderThickness: =0
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =52
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =8
                  TabIndex: =-1
                  Text: ="SOLICITANTE"
                  VerticalAlign: =VerticalAlign.Middle
                  Wrap: =false
            - tplTabCabReserva:
                Control: Label
                Properties:
                  AutoHeight: =false
                  Color: =corTextoSec
                  FillPortions: =1
                  FocusedBorderThickness: =0
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =52
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =8
                  TabIndex: =-1
                  Text: ="RESERVA SAP"
                  VerticalAlign: =VerticalAlign.Middle
                  Wrap: =false
            - tplTabCabAlmox:
                Control: Label
                Properties:
                  AutoHeight: =false
                  Color: =corTextoSec
                  FillPortions: =1
                  FocusedBorderThickness: =0
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =52
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =8
                  TabIndex: =-1
                  Text: ="ALMOXARIFADO"
                  VerticalAlign: =VerticalAlign.Middle
                  Wrap: =false
            - tplTabCabTipo:
                Control: Label
                Properties:
                  AutoHeight: =false
                  Color: =corTextoSec
                  FocusedBorderThickness: =0
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =52
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =8
                  TabIndex: =-1
                  Text: ="TIPO"
                  VerticalAlign: =VerticalAlign.Middle
                  Width: =100
                  Wrap: =false
            - tplTabCabRetirada:
                Control: Label
                Properties:
                  AutoHeight: =false
                  Color: =corTextoSec
                  FocusedBorderThickness: =0
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =52
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =8
                  TabIndex: =-1
                  Text: ="RETIRADA"
                  VerticalAlign: =VerticalAlign.Middle
                  Width: =100
                  Wrap: =false
            - tplTabCabStatus:
                Control: Label
                Properties:
                  AutoHeight: =false
                  Color: =corTextoSec
                  FocusedBorderThickness: =0
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =52
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =8
                  TabIndex: =-1
                  Text: ="STATUS"
                  VerticalAlign: =VerticalAlign.Middle
                  Width: =170
                  Wrap: =false
            - tplTabCabAcao:
                Control: Label
                Properties:
                  AutoHeight: =false
                  Color: =corTexto
                  FocusedBorderThickness: =0
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Normal
                  Height: =52
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =10
                  TabIndex: =-1
                  Text: =""
                  VerticalAlign: =VerticalAlign.Middle
                  Width: =24
                  Wrap: =false
      - tplVazio:
          Control: Label
          Properties:
            Align: =Align.Center
            AutoHeight: =false
            Color: =corTextoSec
            FocusedBorderThickness: =0
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Normal
            Height: =60
            LayoutMinHeight: =0
            LayoutMinWidth: =0
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =10
            TabIndex: =-1
            Text: ="Nenhuma solicitação encontrada."
            VerticalAlign: =VerticalAlign.Middle
            Visible: =tplGal.AllItemsCount = 0
            Wrap: =true
      - tplGal:
          Control: Gallery
          Variant: Vertical
          Properties:
            AccessibleLabel: ="Lista de solicitações"
            BorderThickness: =0
            FillPortions: =1
            FocusedBorderColor: =corPrimaria
            FocusedBorderThickness: =2
            Items: =colItens
            LayoutMinHeight: =0
            LayoutMinWidth: =0
            ShowScrollbar: =true
            TabIndex: =0
            TemplatePadding: =0
            TemplateSize: =53
          Children:
            - tplGalLinha:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  BorderThickness: =0
                  DropShadow: =DropShadow.None
                  Height: =52
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =12
                  PaddingBottom: =0
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =0
                  Width: =Parent.TemplateWidth
                  X: =0
                  Y: =0
                Children:
                  - tplGalId:
                      Control: Label
                      Properties:
                        AutoHeight: =false
                        Color: =corTexto
                        FocusedBorderThickness: =0
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =52
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =10
                        TabIndex: =-1
                        Text: =Coalesce(Text(ThisItem.ID), "—")
                        VerticalAlign: =VerticalAlign.Middle
                        Width: =56
                        Wrap: =false
                  - tplGalCriado:
                      Control: Label
                      Properties:
                        AutoHeight: =false
                        Color: =corTexto
                        FocusedBorderThickness: =0
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Normal
                        Height: =52
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =10
                        TabIndex: =-1
                        Text: =Text(ThisItem.Criado, "dd/mm/yyyy")
                        VerticalAlign: =VerticalAlign.Middle
                        Width: =110
                        Wrap: =false
                  - tplGalSolic:
                      Control: Label
                      Properties:
                        AutoHeight: =false
                        Color: =corTexto
                        FillPortions: =1
                        FocusedBorderThickness: =0
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Normal
                        Height: =52
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =10
                        TabIndex: =-1
                        Text: =ThisItem.solicitante.DisplayName
                        VerticalAlign: =VerticalAlign.Middle
                        Wrap: =false
                  - tplGalReserva:
                      Control: Label
                      Properties:
                        AutoHeight: =false
                        Color: =corTexto
                        FillPortions: =1
                        FocusedBorderThickness: =0
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Normal
                        Height: =52
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =10
                        TabIndex: =-1
                        Text: =Text(ThisItem.reservaSap)
                        VerticalAlign: =VerticalAlign.Middle
                        Wrap: =false
                  - tplGalAlmox:
                      Control: Label
                      Properties:
                        AutoHeight: =false
                        Color: =corTexto
                        FillPortions: =1
                        FocusedBorderThickness: =0
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Normal
                        Height: =52
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =10
                        TabIndex: =-1
                        Text: =ThisItem.almoxarifado.Value
                        VerticalAlign: =VerticalAlign.Middle
                        Wrap: =false
                  - tplGalTipo:
                      Control: Label
                      Properties:
                        AutoHeight: =false
                        Color: =corTexto
                        FocusedBorderThickness: =0
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Normal
                        Height: =52
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =10
                        TabIndex: =-1
                        Text: =ThisItem.tipoReservaSap.Value
                        VerticalAlign: =VerticalAlign.Middle
                        Width: =100
                        Wrap: =false
                  - tplGalRetirada:
                      Control: Label
                      Properties:
                        AutoHeight: =false
                        Color: =corTexto
                        FocusedBorderThickness: =0
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Normal
                        Height: =52
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =10
                        TabIndex: =-1
                        Text: =If(IsBlank(ThisItem.dataRetirada), "—", Text(ThisItem.dataRetirada, "dd/mm/yyyy"))
                        VerticalAlign: =VerticalAlign.Middle
                        Width: =100
                        Wrap: =false
                  - tplGalStatusCel:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        BorderThickness: =0
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =52
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =0
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Width: =170
                      Children:
                        - tplGalStatusChip:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.SetByContainer
                              BorderThickness: =0
                              DropShadow: =DropShadow.None
                              Fill: =Switch(ThisItem.status.Value, "Aguardando Separação", RGBA(255, 244, 214, 1), "Em Separação", RGBA(222, 235, 255, 1), "Pronto para Retirada", RGBA(224, 245, 233, 1), "Finalizado", RGBA(233, 236, 241, 1), "Cancelado", RGBA(253, 228, 228, 1), RGBA(233, 236, 241, 1))
                              FillPortions: =0
                              Height: =24
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =0
                              LayoutJustifyContent: =LayoutJustifyContent.Center
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =10
                              PaddingRight: =10
                              PaddingTop: =0
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                              Width: =160
                            Children:
                              - tplGalStatusChipTxt:
                                  Control: Label
                                  Properties:
                                    Align: =Align.Center
                                    AutoHeight: =false
                                    Color: =Switch(ThisItem.status.Value, "Aguardando Separação", RGBA(138, 90, 0, 1), "Em Separação", RGBA(21, 82, 168, 1), "Pronto para Retirada", RGBA(22, 110, 60, 1), "Finalizado", RGBA(70, 82, 102, 1), "Cancelado", RGBA(176, 32, 32, 1), RGBA(70, 82, 102, 1))
                                    FillPortions: =1
                                    FocusedBorderThickness: =0
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =24
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =9
                                    TabIndex: =-1
                                    Text: =ThisItem.status.Value
                                    VerticalAlign: =VerticalAlign.Middle
                                    Wrap: =true
                  - tplGalSeta:
                      Control: Label
                      Properties:
                        AutoHeight: =false
                        Color: =corTextoSec
                        FocusedBorderThickness: =0
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =52
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =14
                        TabIndex: =-1
                        Text: ="›"
                        VerticalAlign: =VerticalAlign.Middle
                        Width: =24
                        Wrap: =false
            - tplGalDivisor:
                Control: Rectangle
                Properties:
                  Fill: =corBorda
                  FocusedBorderThickness: =0
                  Height: =1
                  TabIndex: =-1
                  Width: =Parent.TemplateWidth - 32
                  X: =16
                  Y: =52
            - tplGalAbrir:
                Control: Classic/Button
                Properties:
                  BorderColor: =corBorda
                  BorderThickness: =0
                  Color: =corPrimaria
                  Fill: =RGBA(0, 0, 0, 0)
                  FocusedBorderColor: =corTexto
                  FocusedBorderThickness: =2
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =52
                  HoverBorderColor: =corPrimaria
                  HoverColor: =corPrimaria
                  HoverFill: =RGBA(21, 101, 168, 0.05)
                  OnSelect: |-
                    =UpdateContext({varDados: ThisItem, varModal: true})
                  PressedBorderColor: =corBorda
                  PressedColor: =corPrimaria
                  PressedFill: =RGBA(21, 101, 168, 0.1)
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Size: =10
                  Text: =""
                  Tooltip: ="Abrir solicitação " & ThisItem.reservaSap
                  Width: =Parent.TemplateWidth
                  X: =0
                  Y: =0
