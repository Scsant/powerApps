                                      Reset(txtContato);
                                      Reset(txtReservaSAP);
                                      Reset(cbTipoReserva);
                                      Reset(txtHorarioRetirada);
                                      Reset(txtObservacao);
                                      Reset(txtMatricula);
                                      Reset(dataRetirada);
                                      Reset(cbAlmoxarifado);
                                      UpdateContext({varErroValidacao: Blank()});
                                      Navigate(Menu, ScreenTransition.Fade)
                                    PressedBorderColor: =corBorda
                                    PressedColor: =corPrimaria
                                    PressedFill: =corBorda
                                    RadiusBottomLeft: =6
                                    RadiusBottomRight: =6
                                    RadiusTopLeft: =6
                                    RadiusTopRight: =6
                                    Size: =10
                                    Text: ="Cancelar"
                                    Width: =130
                              - novaBtnEnviar:
                                  Control: Classic/Button
                                  Properties:
                                    BorderColor: =corPrimaria
                                    BorderThickness: =1
                                    Color: =Color.White
                                    Fill: =corPrimaria
                                    FocusedBorderColor: =corTexto
                                    FocusedBorderThickness: =2
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =40
                                    HoverBorderColor: =corPrimariaHover
                                    HoverColor: =Color.White
                                    HoverFill: =corPrimariaHover
                                    OnSelect: |-
                                      =// Validações: apenas o que existe na lista
                                      UpdateContext({
                                          varErroValidacao:
                                              If(
                                                  IsBlank(txtMatricula.Text), "Matrícula não informada.",
                                                  Len(txtMatricula.Text) <> 8, "Matrícula deve ter exatamente 8 dígitos.",
                                                  IsBlank(cbArea.Selected.Value), "Área não selecionada.",
                                                  IsBlank(cbUnidadeNegocios.Selected.Value), "Unidade de negócios não selecionada.",
                                                  IsBlank(txtContato.Text), "Contato não informado.",
                                                  Len(txtContato.Text) <= 9, "Contato deve ter mais de 9 dígitos.",
                                                  IsBlank(cbAlmoxarifado.Selected.Value), "Almoxarifado não selecionado.",
                                                  IsBlank(txtReservaSAP.Text), "Reserva SAP não informada.",
                                                  IsBlank(cbTipoReserva.Selected.Value), "Tipo de reserva não selecionado.",
                                                  (cbTipoReserva.Selected.Value <> "Atendimento") && IsBlank(dataRetirada.SelectedDate), "Data de retirada não informada.",
                                                  (cbTipoReserva.Selected.Value <> "Atendimento") && dataRetirada.SelectedDate < Today(), "Data de retirada não pode ser anterior a hoje.",
                                                  (cbTipoReserva.Selected.Value <> "Atendimento" && cbTipoReserva.Selected.Value <> "Delivery") && IsBlank(txtHorarioRetirada.Selected.Value), "Horário de retirada não selecionado.",
                                                  Blank()
                                              )
                                      });

                                      If(
                                          IsBlank(varErroValidacao),

                                          Patch(
                                              soliMateriais,
                                              Defaults(soliMateriais),
                                              {
                                                  solicitante: {
                                                      '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",
                                                      Claims: "i:0#.f|membership|" & Lower(User().Email),
                                                      DisplayName: User().FullName,
                                                      Email: User().Email,
                                                      Department: "",
                                                      JobTitle: "",
                                                      Picture: ""
                                                  },
                                                  unidadeNegocios: { Value: cbUnidadeNegocios.Selected.Value },
                                                  area: { Value: cbArea.Selected.Value },
                                                  contato: Value(txtContato.Text),
                                                  reservaSap: Value(txtReservaSAP.Text),
                                                  tipoReservaSap: { Value: cbTipoReserva.Selected.Value },
                                                  dataRetirada: If(cbTipoReserva.Selected.Value <> "Atendimento", dataRetirada.SelectedDate, Blank()),
                                                  janelaHorarioRetirada: { Value: If(cbTipoReserva.Selected.Value <> "Atendimento" && cbTipoReserva.Selected.Value <> "Delivery", txtHorarioRetirada.Selected.Value, Blank()) },
                                                  observacao: txtObservacao.Text,
                                                  status: { Value: "Aguardando Separação" },
                                                  almoxarifado: { Value: cbAlmoxarifado.Selected.Value },
                                                  ultimaAlteracao: Now(),
                                                  matricula: Value(txtMatricula.Text)
                                              }
                                          );
                                          Set(varUltimaReserva, txtReservaSAP.Text);
                                          Set(varUltimoAlmox, cbAlmoxarifado.Selected.Value);
                                          Reset(cbArea);
                                          Reset(cbUnidadeNegocios);
                                          Reset(txtContato);
                                          Reset(txtReservaSAP);
                                          Reset(cbTipoReserva);
                                          Reset(txtHorarioRetirada);
                                          Reset(txtObservacao);
                                          Reset(txtMatricula);
                                          Reset(dataRetirada);
                                          Reset(cbAlmoxarifado);
                                          UpdateContext({varErroValidacao: Blank()});
                                          Navigate(Finalizada, ScreenTransition.Fade),

                                          Notify(varErroValidacao, NotificationType.Error)
                                      )
                                    PressedBorderColor: =corPrimaria
                                    PressedColor: =Color.White
                                    PressedFill: =corPrimariaHover
                                    RadiusBottomLeft: =6
                                    RadiusBottomRight: =6
                                    RadiusTopLeft: =6
                                    RadiusTopRight: =6
                                    Size: =10
                                    Text: ="Enviar solicitação  →"
                                    Width: =190
