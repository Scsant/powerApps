Screens:
  Finalizada:
    Properties:
      Fill: =corFundo
      LoadingSpinnerColor: =corPrimaria
    Children:
      - fimRaiz:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            BorderThickness: =0
            DropShadow: =DropShadow.None
            Fill: =corFundo
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =0
            Width: =Parent.Width
            X: =0
            Y: =0
          Children:
            - fimHeader:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  BorderThickness: =0
                  DropShadow: =DropShadow.None
                  Fill: =corHeader
                  FillPortions: =0
                  Height: =64
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =14
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =0
                  PaddingLeft: =32
                  PaddingRight: =32
                  PaddingTop: =0
                Children:
                  - fimLogo:
                      Control: Label
                      Properties:
                        AutoHeight: =false
                        Color: =Color.White
                        FocusedBorderThickness: =0
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =64
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =18
                        TabIndex: =-1
                        Text: ="Bracell"
                        VerticalAlign: =VerticalAlign.Middle
                        Width: =90
                        Wrap: =true
                  - fimDivisor:
                      Control: Rectangle
                      Properties:
                        Fill: =RGBA(255, 255, 255, 0.5)
                        FocusedBorderThickness: =0
                        Height: =24
                        TabIndex: =-1
                        Width: =1
                  - fimPortal:
                      Control: Label
                      Properties:
                        AutoHeight: =false
                        Color: =Color.White
                        FocusedBorderThickness: =0
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =64
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =12
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =11
                        TabIndex: =-1
                        Text: ="Portal do Almoxarifado"
                        VerticalAlign: =VerticalAlign.Middle
                        Width: =200
                        Wrap: =true
                  - fimSpacer:
                      Control: Label
                      Properties:
                        AutoHeight: =false
                        FillPortions: =1
                        FocusedBorderThickness: =0
                        Height: =1
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        TabIndex: =-1
                        Text: =""
                        Width: =1
                  - fimNavInicio:
                      Control: Label
                      Properties:
                        Align: =Align.Center
                        AutoHeight: =false
                        BorderColor: =RGBA(0,0,0,0)
                        BorderThickness: =0
                        Color: =RGBA(255, 255, 255, 0.72)
                        FocusedBorderColor: =corTexto
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Normal
                        Height: =64
                        HoverColor: =Color.White
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =Navigate(Menu, ScreenTransition.Fade)
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =10
                        TabIndex: =0
                        Text: ="Início"
                        VerticalAlign: =VerticalAlign.Middle
                        Width: =60
                        Wrap: =true
                  - fimNavMinhas:
                      Control: Label
                      Properties:
                        Align: =Align.Center
                        AutoHeight: =false
                        BorderColor: =RGBA(0,0,0,0)
                        BorderThickness: =0
                        Color: =RGBA(255, 255, 255, 0.72)
                        FocusedBorderColor: =corTexto
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Normal
                        Height: =64
                        HoverColor: =Color.White
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =Navigate(minhasSolicitacoes, ScreenTransition.Fade)
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =10
                        TabIndex: =0
                        Text: ="Minhas solicitações"
                        VerticalAlign: =VerticalAlign.Middle
                        Width: =150
                        Wrap: =true
                  - fimNavFila:
                      Control: Label
                      Properties:
                        Align: =Align.Center
                        AutoHeight: =false
                        BorderColor: =RGBA(0,0,0,0)
                        BorderThickness: =0
                        Color: =RGBA(255, 255, 255, 0.72)
                        FocusedBorderColor: =corTexto
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Normal
                        Height: =64
                        HoverColor: =Color.White
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =Navigate(filaAtendimento, ScreenTransition.Fade)
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =10
                        TabIndex: =0
                        Text: ="Fila de atendimento"
                        VerticalAlign: =VerticalAlign.Middle
                        Visible: =varAtendente || varSupervisor
                        Width: =150
                        Wrap: =true
                  - fimNavEquipe:
                      Control: Label
                      Properties:
                        Align: =Align.Center
                        AutoHeight: =false
                        BorderColor: =RGBA(0,0,0,0)
                        BorderThickness: =0
                        Color: =RGBA(255, 255, 255, 0.72)
                        FocusedBorderColor: =corTexto
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Normal
                        Height: =64
                        HoverColor: =Color.White
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =Navigate(cadastroEquipe, ScreenTransition.Fade)
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =10
                        TabIndex: =0
                        Text: ="Equipe"
                        VerticalAlign: =VerticalAlign.Middle
                        Visible: =varSupervisor
                        Width: =70
                        Wrap: =true
                  - fimAvatar:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        BorderThickness: =0
                        DropShadow: =DropShadow.None
                        Fill: =Color.White
                        FillPortions: =0
                        Height: =32
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =0
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        RadiusBottomLeft: =16
                        RadiusBottomRight: =16
                        RadiusTopLeft: =16
                        RadiusTopRight: =16
                        Width: =32
                      Children:
                        - fimAvatarTxt:
                            Control: Label
                            Properties:
                              Align: =Align.Center
                              AutoHeight: =false
                              Color: =corHeader
                              FillPortions: =1
                              FocusedBorderThickness: =0
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =32
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =9
                              TabIndex: =-1
                              Text: =fxIniciais
                              VerticalAlign: =VerticalAlign.Middle
                              Wrap: =true
                  - fimUsuario:
                      Control: Label
                      Properties:
                        AutoHeight: =false
                        Color: =Color.White
                        FocusedBorderThickness: =0
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Normal
                        Height: =64
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =10
                        TabIndex: =-1
                        Text: =fxNomeCurto
                        VerticalAlign: =VerticalAlign.Middle
                        Width: =170
                        Wrap: =true
            - fimCorpo:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  BorderThickness: =0
                  DropShadow: =DropShadow.None
                  Fill: =corFundo
                  FillPortions: =1
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =0
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  PaddingBottom: =32
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =28
                Children:
                  - fimConteudo:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        BorderThickness: =0
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =440
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =20
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Width: =Min(1100, Parent.Width - 64)
                      Children:
                        - fimTopo:
                            Control: Label
                            Properties:
                              AutoHeight: =false
                              Color: =corFundo
                              FocusedBorderThickness: =0
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Normal
                              Height: =40
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =8
                              TabIndex: =-1
                              Text: =""
                              Wrap: =true
                        - fimCard:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              BorderColor: =corBorda
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =corCard
                              FillPortions: =0
                              Height: =360
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =16
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =36
                              PaddingLeft: =32
                              PaddingRight: =32
                              PaddingTop: =36
                              RadiusBottomLeft: =10
                              RadiusBottomRight: =10
                              RadiusTopLeft: =10
                              RadiusTopRight: =10
                              Width: =Min(560, Parent.Width)
                            Children:
                              - fimCheck:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Center
                                    BorderThickness: =0
                                    DropShadow: =DropShadow.None
                                    Fill: =corSucessoClaro
                                    FillPortions: =0
                                    Height: =72
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =0
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    RadiusBottomLeft: =36
                                    RadiusBottomRight: =36
                                    RadiusTopLeft: =36
                                    RadiusTopRight: =36
                                    Width: =72
                                  Children:
                                    - fimCheckTxt:
                                        Control: Label
                                        Properties:
                                          Align: =Align.Center
                                          AutoHeight: =false
                                          Color: =corSucesso
                                          FillPortions: =1
                                          FocusedBorderThickness: =0
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Semibold
                                          Height: =72
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =26
                                          TabIndex: =-1
                                          Text: ="✓"
                                          VerticalAlign: =VerticalAlign.Middle
                                          Wrap: =true
                              - fimTitulo:
                                  Control: Label
                                  Properties:
                                    Align: =Align.Center
                                    AutoHeight: =true
                                    Color: =corTexto
                                    FocusedBorderThickness: =0
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =20
                                    TabIndex: =-1
                                    Text: ="Solicitação enviada!"
                                    Wrap: =true
                              - fimTexto:
                                  Control: Label
                                  Properties:
                                    Align: =Align.Center
                                    AutoHeight: =true
                                    Color: =corTextoSec
                                    FocusedBorderThickness: =0
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Normal
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =11
                                    TabIndex: =-1
                                    Text: ="A reserva SAP " & varUltimaReserva & " foi registrada para o " & varUltimoAlmox & " e está aguardando separação."
                                    Wrap: =true
                              - fimDica:
                                  Control: Label
                                  Properties:
                                    Align: =Align.Center
                                    AutoHeight: =true
                                    Color: =corTextoSec
                                    FocusedBorderThickness: =0
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Normal
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =9
                                    TabIndex: =-1
                                    Text: ="Acompanhe o andamento em Minhas solicitações. Voltando ao início em instantes…"
                                    Wrap: =true
                              - fimBotoes:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.SetByContainer
                                    BorderThickness: =0
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =40
                                    LayoutAlignItems: =LayoutAlignItems.Start
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =12
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                  Children:
                                    - fimBotoesEsqEsp:
                                        Control: Label
                                        Properties:
                                          AutoHeight: =false
                                          FillPortions: =1
                                          FocusedBorderThickness: =0
                                          Height: =1
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          TabIndex: =-1
                                          Text: =""
                                          Width: =1
                                    - fimBtnMinhas:
                                        Control: Classic/Button
                                        Properties:
                                          BorderColor: =corBorda
                                          BorderThickness: =1
                                          Color: =corPrimaria
                                          Fill: =Color.White
                                          FocusedBorderColor: =corTexto
                                          FocusedBorderThickness: =2
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Semibold
                                          Height: =40
                                          HoverBorderColor: =corPrimaria
                                          HoverColor: =corPrimaria
                                          HoverFill: =corFundo
                                          OnSelect: =Navigate(minhasSolicitacoes, ScreenTransition.Fade)
                                          PressedBorderColor: =corBorda
                                          PressedColor: =corPrimaria
                                          PressedFill: =corBorda
                                          RadiusBottomLeft: =6
                                          RadiusBottomRight: =6
                                          RadiusTopLeft: =6
                                          RadiusTopRight: =6
                                          Size: =10
                                          Text: ="Minhas solicitações"
                                          Width: =180
                                    - fimBtnInicio:
                                        Control: Classic/Button
                                        Properties:
                                          BorderColor: =corPrimaria
                                          BorderThickness: =1
                                          Color: =Color.White
                                          Fill: =corPrimaria
                                          FocusedBorderColor: =corTexto
                                          FocusedBorderThickness: =2
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Semibold
                                          Height: =40
                                          HoverBorderColor: =corPrimariaHover
                                          HoverColor: =Color.White
                                          HoverFill: =corPrimariaHover
                                          OnSelect: =Navigate(Menu, ScreenTransition.Fade)
                                          PressedBorderColor: =corPrimaria
                                          PressedColor: =Color.White
                                          PressedFill: =corPrimariaHover
                                          RadiusBottomLeft: =6
                                          RadiusBottomRight: =6
                                          RadiusTopLeft: =6
                                          RadiusTopRight: =6
                                          Size: =10
                                          Text: ="Ir para o início"
                                          Width: =180
                                    - fimBotoesDirEsp:
                                        Control: Label
                                        Properties:
                                          AutoHeight: =false
                                          FillPortions: =1
                                          FocusedBorderThickness: =0
                                          Height: =1
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          TabIndex: =-1
                                          Text: =""
                                          Width: =1
      - timerMudarTelaHome:
          Control: Timer
          Properties:
            AutoStart: =true
            Duration: =8000
            OnTimerEnd: =If(App.ActiveScreen = Finalizada, Navigate(Menu, ScreenTransition.Fade))
            Visible: =false
            X: =0
            Y: =0
