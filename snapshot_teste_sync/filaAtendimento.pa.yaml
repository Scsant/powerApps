      - iHomeMainSolicitacoesAtendente_3:
          Control: Classic/Icon
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            Color: =RGBA(0, 120, 212, 1)
            DisabledBorderColor: =RGBA(245, 245, 245, 1)
            DisabledColor: =RGBA(225, 223, 221, 1)
            DisabledFill: =RGBA(0, 0, 0, 0)
            FocusedBorderThickness: =0
            Height: =Parent.Height * 1/15
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            HoverColor: =RGBA(54, 176, 75, 1)
            HoverFill: =RGBA(0, 0, 0, 0)
            Icon: =Icon.Hamburger
            OnSelect: |-
              =// 1) Email do usuário (normalizado para evitar problemas de maiúsculas/minúsculas)
              UpdateContext({ varUsuarioEmail: User().Email });

              // 2) Tenta localizar o atendente pelo e-mail (Pessoa → Email)
              UpdateContext({
                  varAtendenteAlmo:
                      With(
                          { c: Filter(atendentes, colab.Email = varUsuarioEmail) },
                          If(CountRows(c) > 0, First(c), Blank())
                      )
              });

              // 3) Caso não encontre atendente, tenta localizar como supervisor
              UpdateContext({
                  varSupervisorAlmo:
                      If(
                          IsBlank(varAtendenteAlmo),
                          With(
                              { s: Filter(supervisores, colab.Email = varUsuarioEmail) },
                              If(CountRows(s) > 0, First(s), Blank())
                          ),
                          Blank()
                      )
              });

              // 4) Define o almoxarifado do usuário (Choice) com base no perfil encontrado
              UpdateContext({
                  varAlmoxUsuario:
                      If(
                          !IsBlank(varAtendenteAlmo), varAtendenteAlmo.almoxarifado,
                          !IsBlank(varSupervisorAlmo), varSupervisorAlmo.almoxarifado,
                          Blank()
                      ),
                  varPerfilUsuario:
                      If(
                          !IsBlank(varAtendenteAlmo), "Atendente",
                          !IsBlank(varSupervisorAlmo), "Supervisor",
                          ""
                      )
              });

              // 5) Se nenhum perfil for encontrado, notifica erro e limpa a coleção
              If(
                  IsBlank(varAlmoxUsuario),

                  Clear(colFilaAtendimento);
                  Notify(
                      "Seu usuário não está cadastrado como Atendente ou Supervisor nas listas. Verifique com o administrador.",
                      NotificationType.Error
                  ),

                  // 6) Caso exista almoxarifado, filtra as solicitações pelo status e almoxarifado
                  ClearCollect(
                      colFilaAtendimento,
                      Filter(
                          soliMateriais,
                          almoxarifado.Value = varAlmoxUsuario.Value
                      )
                  )
              );
            PressedBorderColor: =RGBA(0, 0, 0, 0)
            PressedColor: =RGBA(16, 110, 190, 1)
            PressedFill: =RGBA(0, 0, 0, 0)
            Width: =Parent.Width * 1/20
            X: =Parent.Width * 9/10
            Y: =Parent.Height * 2/10
