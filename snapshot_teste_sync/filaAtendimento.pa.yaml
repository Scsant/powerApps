                            Properties:
                              Align: =Align.Center
                              BorderColor: =RGBA(245, 245, 245, 1)
                              BorderThickness: =0
                              Color: =RGBA(50, 49, 48, 1)
                              Default: =
                              DisabledBorderColor: =RGBA(0, 0, 0, 0)
                              DisabledColor: =RGBA(161, 159, 157, 1)
                              DisabledFill: =RGBA(235, 240, 242, 1)
                              Fill: =RGBA(235, 240, 242, 1)
                              Font: =Font.'Segoe UI'
                              Height: =Parent.Height * 8/10
                              HintText: ="Digite alguma informação relevante..."
                              HoverBorderColor: =RGBA(0, 0, 0, 0)
                              HoverColor: =RGBA(50, 49, 48, 1)
                              HoverFill: =RGBA(235, 240, 242, 1)
                              Mode: =TextMode.MultiLine
                              PressedBorderColor: =RGBA(0, 0, 0, 0)
                              PressedColor: =RGBA(50, 49, 48, 1)
                              PressedFill: =RGBA(235, 240, 242, 1)
                              RadiusBottomLeft: =15
                              RadiusBottomRight: =15
                              RadiusTopLeft: =15
                              RadiusTopRight: =15
                              Size: =Parent.Height * 1/20
                              Width: =Parent.Width * 1
                              Y: =Parent.Height * 2/10
                  - cFooterModalAtendente:
                      Control: GroupContainer
                      Variant: ManualLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(214, 221, 224, 1)
                        Height: =cBgAtendente.Height * 1/9
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =cBgAtendente.Width
                        Y: =cBgAtendente.Height * 8/9
                      Children:
                        - iDefinirModalAtendente:
                            Control: Classic/Icon
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 0)
                              Color: =RGBA(9, 33, 98, 1)
                              DisabledBorderColor: =RGBA(245, 245, 245, 1)
                              DisabledColor: =RGBA(225, 223, 221, 1)
                              DisabledFill: =RGBA(0, 0, 0, 0)
                              FocusedBorderThickness: =4
                              Height: =Parent.Height * 0.75
                              HoverBorderColor: =RGBA(0, 0, 0, 0)
                              HoverColor: =RGBA(16, 110, 190, 1)
                              HoverFill: =RGBA(0, 0, 0, 0)
                              Icon: =Icon.NextArrow
                              PressedBorderColor: =RGBA(0, 0, 0, 0)
                              PressedColor: =RGBA(16, 110, 190, 1)
                              PressedFill: =RGBA(0, 0, 0, 0)
                              Width: =Parent.Width * 0.10
                              X: =cFooterModalAtendente.Width * 0.8
                              Y: =cFooterModalAtendente.Height * 1/8
                        - lbDefinirModalAtendente:
                            Control: Label
                            Properties:
                              Align: =Align.Center
                              BorderColor: =RGBA(0, 0, 0, 0)
                              BorderStyle: =BorderStyle.None
                              BorderThickness: =2
                              Color: =RGBA(50, 49, 48, 1)
                              DisabledBorderColor: =RGBA(0, 0, 0, 0)
                              DisabledColor: =RGBA(161, 159, 157, 1)
                              FocusedBorderThickness: =4
                              Font: =Font.'Segoe UI'
                              Height: =Parent.Height * 1
                              Text: ="Definir"
                              Width: =Parent.Width * 0.2
                              X: =Parent.Width * 0.615
                              Y: =Parent.Height * 0
                        - bDefinirModalAtendente:
                            Control: Classic/Button
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 0)
                              BorderStyle: =BorderStyle.None
                              BorderThickness: =0
                              Color: =RGBA(255, 255, 255, 1)
                              DisabledBorderColor: =RGBA(0, 0, 0, 0)
                              DisabledColor: =RGBA(161, 159, 157, 1)
                              DisabledFill: =RGBA(242, 242, 241, 0)
                              Fill: =RGBA(0, 0, 0, 0)
                              Font: =Font.'Segoe UI'
                              Height: =Parent.Height
                              HoverBorderColor: =RGBA(0, 0, 0, 0)
                              HoverColor: =RGBA(255, 255, 255, 1)
                              HoverFill: =RGBA(0, 0, 0, 0)
                              OnSelect: |
                                =
                                Patch(
                                    soliMateriais,// lista
                                    varDados,// registro atual da gallery
                                    {
                                        status: {Value: dropStatusModalAtendente.Selected.Value},
                                        // Choice de seleção única
                                        ultimaAlteracao: Now(),
                                        atendente: {
                                            '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",
                                            Claims: "i:0#.f|membership|" & Lower(varUsuario.Mail),
                                            DisplayName: varUsuario.DisplayName,
                                            Email: varUsuario.Mail,
                                            Department: "",
                                            JobTitle: "",
                                            Picture: ""
                                        },
                                        dataAtendimento: Now(),
                                        comentario: txtComentarioAtendenteMainModalAtendente.Text
                                    }
                                );

                                Notify(
                                    "Status atualizado.",
                                    NotificationType.Success,
                                    2000
                                );

                                // 1) Email do usuário (normalizado para evitar problemas de maiúsculas/minúsculas)
                                UpdateContext({ varUsuarioEmail: User().Email });

                                // 2) Tenta localizar o atendente pelo e-mail (Pessoa → Email)
                                UpdateContext({
                                    varAtendenteAlmo:
                                        With(
                                            { c: Filter(atendentes, colab.Email = varUsuarioEmail) },
                                            If(CountRows(c) > 0, First(c), Blank())
                                        )
                                });

                                // 3) Caso não encontre atendente, tenta localizar como supervisor
                                UpdateContext({
                                    varSupervisorAlmo:
                                        If(
                                            IsBlank(varAtendenteAlmo),
                                            With(
                                                { s: Filter(supervisores, colab.Email = varUsuarioEmail) },
                                                If(CountRows(s) > 0, First(s), Blank())
                                            ),
                                            Blank()
                                        )
                                });

                                // 4) Define o almoxarifado do usuário (Choice) com base no perfil encontrado
                                UpdateContext({
                                    varAlmoxUsuario:
                                        If(
                                            !IsBlank(varAtendenteAlmo), varAtendenteAlmo.almoxarifado,
                                            !IsBlank(varSupervisorAlmo), varSupervisorAlmo.almoxarifado,
                                            Blank()
                                        ),
                                    varPerfilUsuario:
                                        If(
                                            !IsBlank(varAtendenteAlmo), "Atendente",
                                            !IsBlank(varSupervisorAlmo), "Supervisor",
                                            ""
                                        )
                                });

                                // 5) Se nenhum perfil for encontrado, notifica erro e limpa a coleção
                                If(
                                    IsBlank(varAlmoxUsuario),

                                    Clear(colFilaAtendimento);
                                    Notify(
                                        "Seu usuário não está cadastrado como Atendente ou Supervisor nas listas. Verifique com o administrador.",
                                        NotificationType.Error
                                    ),

                                    // 6) Caso exista almoxarifado, filtra as solicitações pelo status e almoxarifado
                                    ClearCollect(
                                        colFilaAtendimento,
                                        Filter(
                                            soliMateriais,
                                            status.Value = "Aguardando Separação" &&
                                            almoxarifado.Value = varAlmoxUsuario.Value
                                        )
                                    )
                                );
                                Reset(dropStatusModalAtendente);
                                Reset(txtComentarioAtendenteMainModalAtendente);

                                UpdateContext({varModalAtendente: false});
                              PressedBorderColor: =RGBA(0, 0, 0, 0)
                              PressedColor: =RGBA(255, 255, 255, 1)
                              PressedFill: =RGBA(0, 0, 0, 0)
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Size: =Parent.Height * 1/4
                              Text: =
                              Width: =cFooterModalAtendente.Width * 0.3
                              X: =Parent.Width * 0.6
                              Y: =Parent.Height * 0
